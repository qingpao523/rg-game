<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>无尽入侵</title>
<style>
  html, body { margin: 0; padding: 0; background: #050508; height: 100%; overflow: hidden; }
  #game {
    display: block; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    touch-action: none; user-select: none; -webkit-user-select: none;
    background: #000;
  }
  #name-overlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(4,4,10,0.55); }
  .name-box { width: 420px; max-width: 86vw; background: rgba(14,14,22,0.97); border: 1px solid rgba(201,168,106,0.5); border-radius: 14px; padding: 26px 24px; text-align: center; box-sizing: border-box; }
  .name-title { color: #f0d9a0; font-size: 20px; font-weight: bold; margin-bottom: 8px; }
  .name-sub { color: rgba(200,200,210,0.7); font-size: 13px; margin-bottom: 18px; }
  #name-input { width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 16px; background: rgba(30,28,42,0.9); color: #f0ead8; border: 1px solid rgba(201,168,106,0.4); border-radius: 8px; outline: none; text-align: center; }
  #name-input:focus { border-color: #f0d9a0; }
  .name-actions { display: flex; gap: 12px; margin-top: 16px; justify-content: center; }
  .name-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid rgba(201,168,106,0.4); background: rgba(30,28,42,0.9); color: #c9a86a; font-size: 15px; cursor: pointer; }
  .name-btn.primary { background: rgba(201,168,106,0.9); color: #2a1e08; font-weight: bold; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="name-overlay">
  <div class="name-box">
    <div class="name-title">⚔ 给自己起个名字</div>
    <div class="name-sub">名字会显示在排行榜和对局记录里</div>
    <input id="name-input" maxlength="16" placeholder="输入你的名字" autocomplete="off">
    <div class="name-actions">
      <button class="name-btn primary" onclick="Game.savePlayerName()">确认</button>
      <button class="name-btn" onclick="Game.skipPlayerName()">跳过</button>
    </div>
  </div>
</div>
<script>
  // ===== 缓存策略（只下载更新的，没变更的走缓存不重下）=====
  // GAME_VERSION：代码版本，改代码时才升，JS 按它做缓存键（变了才重新下载 JS）
  // 由服务器按 js/ 目录内容指纹注入；file:// 直开时回退手动版本号
  window.GAME_VERSION = '__GAME_VERSION__';
  if (window.GAME_VERSION.indexOf('GAME_VERSION') !== -1) window.GAME_VERSION = '1.1.8';
  // ASSET_VER：图片资源内容哈希，由服务器注入替换下面这行的占位符。
  // 图片按它做缓存键——图片内容不变则 URL 不变走缓存；变了才换 URL 重新下载。
  window.ASSET_VER = '__ASSET_VER__';

  // 按序加载脚本（?v=GAME_VERSION：代码没变则 URL 不变走缓存，变了才重新下载）
  (function () {
    var scripts = ['config', 'assets', 'engine', 'player', 'skills', 'enemies', 'ui', 'audio', 'storage', 'talents', 'wheel', 'craft', 'main'];
    var idx = 0;
    var retries = {};
    var loaded = {};
    function loadNext() {
      if (idx >= scripts.length) return;
      var name = scripts[idx];
      var key = name + ':' + window.GAME_VERSION;
      var s = document.createElement('script');
      s.src = 'js/' + name + '.js?v=' + window.GAME_VERSION + (retries[key] ? '&r=' + retries[key] : '');
      var failed = false;
      var fail = function () {
        if (failed || loaded[key]) return;
        failed = true;
        retries[key] = (retries[key] || 0) + 1;
        if (retries[key] <= 2) {
          console.warn('[loader] 加载失败，重试 ' + retries[key] + '/2: ' + s.src);
          setTimeout(loadNext, 500);
        } else {
          console.error('[loader] 永久失败，跳过: ' + name + '.js');
          idx++;
          loadNext();
        }
      };
      s.onload = function () { loaded[key] = true; clearTimeout(s._watchdog); idx++; loadNext(); };
      s.onerror = fail;
      // 看门狗：脚本 10s 未完成也按失败处理，避免单文件挂起卡死整个游戏
      s._watchdog = setTimeout(fail, 10000);
      document.head.appendChild(s);
    }
    loadNext();
  })();
</script>
</body>
</html>
