<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>无尽入侵</title>
<style>
  html, body { margin: 0; padding: 0; background: #050508; height: 100%; overflow: hidden; }
  #game {
    display: block; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    touch-action: none; user-select: none; -webkit-user-select: none;
    background: #000;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
  // ===== 版本号：每次发版只需改这里，浏览器自动拉取最新代码和资源 =====
  window.GAME_VERSION = '1.1.5';

  // 清除旧缓存（Cache Storage + Service Worker），避免旧版本残留
  try {
    if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
  } catch (e) {}

  // 按序加载带版本号的脚本（版本号变化 → URL 变化 → 强制重新下载）
  (function () {
    var scripts = ['config', 'assets', 'engine', 'player', 'skills', 'enemies', 'ui', 'audio', 'storage', 'talents', 'wheel', 'craft', 'main'];
    var idx = 0;
    function loadNext() {
      if (idx >= scripts.length) return;
      var s = document.createElement('script');
      s.src = 'js/' + scripts[idx] + '.js?v=' + window.GAME_VERSION;
      s.onload = function () { idx++; loadNext(); };
      s.onerror = function () { console.error('[loader] 加载失败: ' + s.src); };
      document.head.appendChild(s);
    }
    loadNext();
  })();
</script>
</body>
</html>
