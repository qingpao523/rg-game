<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>无尽入侵</title>
<style>
  html, body { margin: 0; padding: 0; background: #050508; height: 100%; overflow: hidden; }
  #game {
    display: block; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    touch-action: none; user-select: none; -webkit-user-select: none;
    background: #000;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
  // ===== 缓存策略（只下载更新的，没变更的走缓存不重下）=====
  // GAME_VERSION：代码版本，改代码时才升，JS 按它做缓存键（变了才重新下载 JS）
  window.GAME_VERSION = '1.1.7';
  // ASSET_VER：图片资源内容哈希，由服务器注入替换下面这行的占位符。
  // 图片按它做缓存键——图片内容不变则 URL 不变走缓存；变了才换 URL 重新下载。
  window.ASSET_VER = '__ASSET_VER__';

  // 按序加载脚本（?v=GAME_VERSION：代码没变则 URL 不变走缓存，变了才重新下载）
  (function () {
    var scripts = ['config', 'assets', 'engine', 'player', 'skills', 'enemies', 'ui', 'audio', 'storage', 'talents', 'wheel', 'craft', 'main'];
    var idx = 0;
    function loadNext() {
      if (idx >= scripts.length) return;
      var s = document.createElement('script');
      s.src = 'js/' + scripts[idx] + '.js?v=' + window.GAME_VERSION;
      s.onload = function () { idx++; loadNext(); };
      s.onerror = function () { console.error('[loader] 加载失败: ' + s.src); };
      document.head.appendChild(s);
    }
    loadNext();
  })();
</script>
</body>
</html>
